name: Publish building regulations

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      artifact_id: ${{ steps.pagesArtifact.outputs.artifact_id }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        id: pagesArtifact
        with:
          path: docs
          include-hidden-files: true
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy static site and await file synchronization
        id: deployment
        uses: actions/github-script@v8.0.0
        env:
          PAGES_ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
        with:
          retries: 2
          script: |
            const artifactId = Number(process.env.PAGES_ARTIFACT_ID);
            if (!Number.isSafeInteger(artifactId) || artifactId <= 0) {
              throw new Error('The build job did not provide a valid Pages artifact.');
            }
            const idToken = await core.getIDToken();
            core.setSecret(idToken);
            const {data: deployment} = await github.request('POST /repos/{owner}/{repo}/pages/deployments', {
              ...context.repo,
              artifact_id: artifactId,
              pages_build_version: context.sha,
              oidc_token: idToken
            });
            const deploymentId = deployment.id || context.sha;
            core.setOutput('page_url', deployment.page_url);
            core.info('Created Pages deployment ' + deploymentId);
            const deadline = Date.now() + 30 * 60 * 1000;
            const terminalErrors = new Set(['deployment_failed', 'deployment_content_failed', 'deployment_cancelled', 'deployment_lost']);
            let finished = false;
            let readErrors = 0;
            const cancel = async () => {
              if (finished) return;
              try {
                await github.request('POST /repos/{owner}/{repo}/pages/deployments/{deploymentId}/cancel', {...context.repo, deploymentId});
              } catch (_) {
                core.warning('The pending Pages deployment could not be cancelled.');
              }
              finished = true;
            };
            const onCancel = () => { void cancel(); };
            process.once('SIGINT', onCancel);
            process.once('SIGTERM', onCancel);
            try {
              while (Date.now() < deadline && !finished) {
                let status;
                try {
                  const response = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{deploymentId}', {...context.repo, deploymentId});
                  status = response.data.status;
                  readErrors = 0;
                } catch (error) {
                  readErrors++;
                  if ([401, 403].includes(error.status) || readErrors >= 10) {
                    throw new Error('Unable to read Pages deployment status after repeated API errors.');
                  }
                  core.warning('Pages status request was delayed; retrying.');
                }
                if (status) core.info('Pages status: ' + status);
                if (status === 'succeed') {
                  finished = true;
                  core.setOutput('status', 'succeed');
                  return;
                }
                if (terminalErrors.has(status)) {
                  finished = true;
                  throw new Error('Pages reported ' + status);
                }
                await new Promise(resolve => setTimeout(resolve, 30000));
              }
              throw new Error('Pages file synchronization did not finish within 30 minutes.');
            } finally {
              process.removeListener('SIGINT', onCancel);
              process.removeListener('SIGTERM', onCancel);
              if (!finished) await cancel();
            }
